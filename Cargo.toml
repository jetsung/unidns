[package]
name = "unidns"
version = "0.2.0"
edition = "2024"
description = "自托管的多平台（阿里云 / 腾讯云 DNSPod / CloudFlare）域名解析集中管理服务"
license = "Apache-2.0"
repository = "https://github.com/jetsung/unidns"
readme = "README.md"
keywords = ["dns", "domain", "ddns", "cloudflare", "alibabacloud"]
categories = ["network-programming", "web-programming"]

[dependencies]
argon2 = "0.5"
async-trait = "0.1"
aes-gcm = "0.10"
axum = { version = "0.8", features = ["macros"] }
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
hex = "0.4"
hmac = "0.12"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
rust-embed = { version = "8", features = ["mime-guess"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-rustls", "sqlite", "chrono"] }
thiserror = "2"
time = "0.3"
tokio = { version = "1", features = ["full"] }
toml = "0.8"
tower = "0.5"
tower-http = { version = "0.6", features = ["trace"] }
tower-sessions = "0.14"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
zeroize = "1"

[dev-dependencies]
http-body-util = "0.1"
