# UniDNS 的 Docker Compose 定义。在仓库根目录执行：
#
#   docker compose -f docker/compose.yaml up -d      # 首次会按需构建 unidns:dev
#   docker compose -f docker/compose.yaml logs -f
#   docker compose -f docker/compose.yaml down
#
# 容器使用默认端口 18686 与默认数据目录（工作目录 /app 下的 ./data，即
# /app/data），无需注入 UNIDNS_LISTEN / UNIDNS_DATA_DIR；其余可选配置仍通过
# 环境变量注入（优先级高于 config.toml，容器内无需配置文件）：
#   UNIDNS_MASTER_KEY      凭据加密主密钥（64 位 hex）。可选：不设置时首次启动自动
#                          生成并保存到数据卷 /app/data/secret.key；多机/重建容器场景建议
#                          固定注入，否则换卷后已存凭据无法解密。生成：openssl rand -hex 32
#   UNIDNS_ADMIN_PASSWORD  预置管理员口令（仅首次设置口令时生效）。可选。
#   UNIDNS_SYNC_INTERVAL   定时全量同步间隔（分钟），0 为停用（默认）。可选。
#
# 数据落在仓库根的 data/（SQLite 数据库与 secret.key）。容器以 uid 65532 运行，
# 目录需可写：
#   mkdir -p data && chmod 0777 data
#
# 本地（中国网络）构建默认走 CN.Dockerfile；国际/上线构建把下面
# dockerfile 改为 docker/Dockerfile（官方源）。

name: unidns

services:
  unidns:
    image: unidns:dev
    container_name: unidns
    build:
      context: ..
      dockerfile: docker/CN.Dockerfile
    ports:
      - "18686:18686"
    volumes:
      - ../data:/app/data
    environment:
      # 可选：固定凭据加密主密钥（建议写入 docker/.env，或直接 export）
      # UNIDNS_MASTER_KEY: "${UNIDNS_MASTER_KEY}"
      # 可选：预置管理员口令（仅首次设置口令时生效）
      # UNIDNS_ADMIN_PASSWORD: "${UNIDNS_ADMIN_PASSWORD}"
      # 日志级别（RUST_LOG 语法），可选
      # UNIDNS_LOG: info
    restart: unless-stopped
