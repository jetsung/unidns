name: Docker-Dev

on:
  push:
    branches:
      - dev*
    paths:
      - "src/**"
      - "migrations/**"
      - "frontend/src/**"
      - "frontend/package.json"
      - "frontend/pnpm-lock.yaml"
      - "frontend/pnpm-workspace.yaml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "docker/Dockerfile"
      - ".github/workflows/docker-dev.yml"

env:
  GHCR_SLUG: ghcr.io/${{ github.repository }}

permissions:
  contents: read
  packages: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
            tag: dev-amd64
          - arch: arm64
            runner: ubuntu-24.04-arm
            tag: dev-arm64
    runs-on: ${{ matrix.runner }}
    outputs:
      package_name: ${{ steps.get_package_name.outputs.package_name }}
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v7

      - name: Set package name
        id: get_package_name
        run: |
          PACKAGE_NAME="$(basename ${{ github.repository }})"
          echo "package_name=$PACKAGE_NAME" >> $GITHUB_ENV
          echo "package_name=$PACKAGE_NAME" >> $GITHUB_OUTPUT

      - name: Login to GitHub Container Registry (ghcr.io)
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./docker/Dockerfile
          platforms: linux/${{ matrix.arch }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ env.GHCR_SLUG }}:${{ matrix.tag }}
          provenance: false
          sbom: false

  manifest:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push multi-arch manifest
        run: |
          docker buildx imagetools create --tag ${{ env.GHCR_SLUG }}:dev \
            ${{ env.GHCR_SLUG }}:dev-amd64 \
            ${{ env.GHCR_SLUG }}:dev-arm64
        shell: bash

      - name: Delete old package versions
        uses: dataaxiom/ghcr-cleanup-action@v1
        with:
          package-name: ${{ needs.build.outputs.package_name }}
          delete-untagged: true
          keep-n-tagged: 5
